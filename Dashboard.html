<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
</head>
<body>
  <!-- Top Header -->
  <header>
    <span>Household Budget & Expense Management</span>
    <div>
      <button>Log out</button>
      <span>2</span>
    </div>
  </header>

  <!-- Main Section -->
  <main>
    <h1>Your month, at a glance.</h1>
    <p>September 2026</p>
    <!-- Month Filter -->
    <label for="month">Month</label>
    <select id="month">
      <option selected>September 2026</option>
    </select>

    <!-- Buttons -->
    <div>
      <button>Set budget</button>
      <button>+ Add expense</button>
    </div>

    <!-- Cards -->
    <div>
      <div><span>Monthly budget</span> <strong>Not set</strong></div>
      <div><span>Spent this month</span> <strong>৳0</strong></div>
      <div><span>Remaining balance</span> <strong>—</strong></div>
    </div>
  </main>
</body>
</html>
