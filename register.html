<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeBudget - Account</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="auth-container">
    <!-- Left Hero Section -->
    <div class="auth-left">
      <div class="brand">
        <div class="logo-box">
          <i class="fa-solid fa-coins"></i>
        </div>
        <h2>HomeBudget</h2>
      </div>

      <div class="hero-content">
        <p class="tagline">A LITTLE CLARITY, EVERY DAY</p>
        <h1 class="hero-title">
          Your month.<br>
          Your money.<br>
          <span>In one place.</span>
        </h1>
        <p class="hero-description">
          A simple way to keep track of the money that comes home — and where it goes.
        </p>
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="auth-right">
      <div class="form-wrapper">
        <h2 id="auth-heading" class="form-title">Create your account</h2>
        <p id="auth-subheading" class="form-subtitle">Start a clearer month for your household.</p>

        <!-- Auth Tabs -->
        <div class="auth-tabs">
          <button id="tab-login" class="tab-btn" onclick="switchAuthTab('login')">Log in</button>
          <button id="tab-register" class="tab-btn active" onclick="switchAuthTab('register')">Register</button>
        </div>

        <!-- Register Form -->
        <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
          <div class="form-group">
            <label for="reg-email">Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input type="password" id="reg-password" placeholder="At least 6 characters" required minlength="6">
          </div>

          <div class="form-group">
            <label for="reg-confirm-password">Confirm password</label>
            <input type="password" id="reg-confirm-password" placeholder="Enter your password again" required>
          </div>

          <button type="submit" class="submit-btn">Create account</button>
        </form>

        <!-- Login Form -->
        <form id="login-form" class="auth-form" style="display: none;" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="submit-btn">Log in</button>
        </form>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
